<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Simplified Favicon Setup -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#d97706" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Arcane Kitchen" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcane Kitchen - Where Culinary Magic Meets Ancient Wisdom</title>
    <meta
      name="description"
      content="Discover enchanted recipes, craft magical potions, and build your mystical cookbook with our AI-powered culinary companion. Join the coven of kitchen witches exploring ancient culinary arts."
    />
    <meta
      name="keywords"
      content="recipes, cooking, magical, mystical, AI chef, culinary arts, kitchen witch, enchanted cooking"
    />
  </head>
  <body class="m-0 font-sans">
    <div id="root"></div>
    <section
      id="startup-error"
      hidden
      style="
        max-width: 480px;
        margin: 40px auto;
        padding: 24px;
        text-align: center;
        font-family: system-ui, sans-serif;
        color: #2c1810;
      "
    >
      <img
        src="/images/catwitch.webp"
        width="960"
        height="889"
        alt="Two cats in witch hats and glasses. Caption: Don't be fooled by our glasses, we dumb as hell."
        style="width: 100%; height: auto; border-radius: 20px"
      />
      <h1>Our kitchen magic went a little sideways.</h1>
      <p>We couldn't load the website. Check your connection and try again.</p>
      <button
        type="button"
        onclick="location.reload()"
        style="
          padding: 12px 20px;
          border: 0;
          border-radius: 12px;
          background: #6d28d9;
          color: white;
          font: inherit;
          cursor: pointer;
        "
      >
        Reload kitchen
      </button>
    </section>
    <script>
      function showStartupError() {
        if (!document.getElementById('root').hasChildNodes()) {
          document.getElementById('startup-error').hidden = false;
        }
      }
      window.addEventListener(
        'error',
        function (event) {
          if (event.target instanceof HTMLScriptElement || event.error)
            showStartupError();
        },
        true
      );
      window.addEventListener('unhandledrejection', showStartupError);
    </script>
    <noscript>
      <section
        style="
          max-width: 480px;
          margin: 40px auto;
          padding: 24px;
          text-align: center;
          font-family: system-ui, sans-serif;
        "
      >
        <img
          src="/images/catwitch.webp"
          width="960"
          height="889"
          alt="Two cats wearing witch hats and glasses"
          style="width: 100%; height: auto; border-radius: 20px"
        />
        <h1>The kitchen needs JavaScript</h1>
        <p>
          Enable JavaScript in your browser, then reload to discover recipes.
        </p>
      </section>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
